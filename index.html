<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>Weather API</title>
  </head>
  <body>
    <div class="main-div font">
      <!-- search-->
      <div class="search-div">
        <input
          type="text"
          id="inputId"
          class="font"
          placeholder="Enter the city"
        />
        <button id="btnId">
          <i class="fa-solid fa-magnifying-glass fa-lg"></i>
        </button>
      </div>

      <!-- Date & City -->
      <div class="dcInfo">
        <p id="date">Date</p>
        <h1 id="city">Telangana</h1>
      </div>

      <!-- Weather info-->
      <div id="weatherInfo"></div>

      <!-- Temperature -->
      <h1 id="temp" class="color-azure">16*c</h1>

      <!-- Temperature Extra Info -->
      <div class="tempxInfo color-azure">
        <div>
          <h5>High</h5>
          <p id="tempMax">12.4</p>
        </div>
        <div>
          <h5>Low</h5>
          <p id="tempMin">12.4</p>
        </div>
      </div>
    </div>
  </body>
  <script src="index.js" type="module"></script>
</html>
